services:
  db:
    image: postgres:15
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=medicure
      - POSTGRES_USER=medicure_user
      - POSTGRES_PASSWORD=medicure_password
    restart: always

  web:
    build: .
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - .:/app
    ports:
      - "8000:8000"
    environment:
      - POSTGRES_DB=medicure
      - POSTGRES_USER=medicure_user
      - POSTGRES_PASSWORD=medicure_password
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      # Ensure these match your existing .env or override them here
      - EMAIL_HOST_USER=${EMAIL_HOST_USER}
      - EMAIL_HOST_PASSWORD=${EMAIL_HOST_PASSWORD}
    depends_on:
      - db
    env_file:
      - .env

volumes:
  postgres_data:
